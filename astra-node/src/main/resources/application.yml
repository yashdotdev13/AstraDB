spring:
  application:
    name: astra-node

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

astra:
  raft:
    node-id: node-1

    # Comma-separated Raft peer IDs
    peers: ""

    # Map peer IDs to their HTTP base addresses
    # Example: "node-2=http://localhost:8082,node-3=http://localhost:8083"
    peer-addresses: ""

    storage-path: ./data/raft

    election:
      minimum-timeout-ms: 300
      maximum-timeout-ms: 600

    heartbeat-interval-ms: 50

    transport:
      connect-timeout-ms: 500
      request-timeout-ms: 1000
