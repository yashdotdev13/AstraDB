name: AstraDB CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-db-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Code Quality (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw --version

      # Runs formatting, static analysis, tests,
      # packaging, and coverage report generation.
      - name: Build and verify all modules
        run: ./mvnw -B clean verify

      # Upload test reports even if the build fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
          retention-days: 7

      # Upload JaCoCo coverage reports.
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            target/site/jacoco-aggregate/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 14
